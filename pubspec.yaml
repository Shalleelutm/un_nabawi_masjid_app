    sdk: flutter

  provider: ^6.1.5
  shared_preferences: ^2.2.3
  sqflite: ^2.3.0
  path: ^1.8.0
  path_provider: ^2.1.5
  uuid: ^4.4.0
  intl: ^0.18.1
  connectivity_plus: ^7.1.1
  audioplayers: ^6.6.0
  just_audio: ^0.9.36
  audio_waveforms: ^1.0.4
  vibration: ^3.1.8
  confetti: ^0.7.0
  lottie: ^3.0.0
  animations: ^2.0.7
  simple_animations: ^5.0.0
  flutter_staggered_animations: ^1.1.0
  animated_text_kit: ^4.2.2
  flutter_spinkit: ^5.2.0
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  glassmorphism: ^3.0.0
  flip_card: ^0.7.0
  liquid_swipe: ^3.1.0
