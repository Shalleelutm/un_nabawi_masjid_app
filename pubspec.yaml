  image_picker: ^1.0.7
  cached_network_image: ^3.4.0
  geolocator: ^12.0.0
  flutter_compass: ^0.8.1
  permission_handler: ^12.0.1
  local_auth: ^2.1.6
  fl_chart: ^0.68.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
